<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A new personal site from Sami Alkayyal is currently in progress."
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>Coming soon · Sami Alkayyal</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #0d1117;
        --card: rgba(22, 29, 40, 0.82);
        --text: #f4f7fb;
        --muted: #aab6c5;
        --accent: #8bd3dd;
        --border: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text);
        background:
          radial-gradient(circle at 15% 10%, rgba(139, 211, 221, 0.16), transparent 34%),
          radial-gradient(circle at 90% 85%, rgba(129, 140, 248, 0.14), transparent 35%),
          var(--background);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 680px);
        padding: clamp(32px, 8vw, 72px);
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--card);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        margin: 0 0 28px;
        color: var(--accent);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 11ch;
        margin: 0;
        font-size: clamp(3rem, 9vw, 6.5rem);
        line-height: 0.94;
        letter-spacing: -0.07em;
      }

      .message {
        max-width: 42ch;
        margin: 28px 0 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.7;
      }

      footer {
        margin-top: 56px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      @media (max-width: 480px) {
        main {
          border-radius: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">samikayyal.com</p>
      <h1>Coming soon.</h1>
      <p class="message">
        I’m working on a new home for my projects, experiments, and ideas.
        Check back soon.
      </p>
      <footer>— Sami Alkayyal</footer>
    </main>
  </body>
</html>
